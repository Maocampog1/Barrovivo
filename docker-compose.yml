version: '3.9'

services:
  web:
    build: .
    container_name: barrovivo_app
    command: gunicorn Barrovivo.wsgi:application --bind 0.0.0.0:8080 --workers 3
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/multimedia
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: barrovivo_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/multimedia
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
